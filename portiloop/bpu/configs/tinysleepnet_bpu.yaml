model_parameters:
  onnx_model: '../../models/tinysleepnet/tinysleepnet.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '../build_tinysleepnet'
  output_model_file_prefix: 'tinysleepnet_bpu'

input_parameters:
  input_name: 'x;c;h'
  input_type_rt: 'featuremap;featuremap;featuremap'
  input_layout_rt: 'NCHW;NHWC;NHWC'
  input_type_train: 'featuremap;featuremap;featuremap'
  input_layout_train: 'NCHW;NHWC;NHWC'
  norm_type: 'no_preprocess;no_preprocess;no_preprocess'

calibration_parameters:
  cal_data_dir: '../cal_data/tinysleepnet/x;../cal_data/tinysleepnet/c;../cal_data/tinysleepnet/h'
  cal_data_type: 'float32;float32;float32'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
