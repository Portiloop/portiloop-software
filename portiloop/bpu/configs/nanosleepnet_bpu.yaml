model_parameters:
  onnx_model: '../../models/nanosleepnet/nanosleepnet.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '../build_nanosleepnet'
  output_model_file_prefix: 'nanosleepnet_bpu'

input_parameters:
  input_name: 'x;past_tokens'
  input_type_rt: 'featuremap;featuremap'
  input_layout_rt: 'NCHW;NCHW'
  input_type_train: 'featuremap;featuremap'
  input_layout_train: 'NCHW;NCHW'
  norm_type: 'no_preprocess;no_preprocess'

calibration_parameters:
  cal_data_dir: '../cal_data/nanosleepnet/x;../cal_data/nanosleepnet/past_tokens'
  cal_data_type: 'float32;float32'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
