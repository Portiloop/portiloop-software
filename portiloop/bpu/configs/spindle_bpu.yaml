model_parameters:
  onnx_model: '../../models/portiloop_spindle.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '../build_spindle'
  output_model_file_prefix: 'portiloop_model_bpu'

input_parameters:
  input_name: 'x;h'
  input_type_rt: 'featuremap;featuremap'
  input_layout_rt: 'NCHW;NHWC'
  input_type_train: 'featuremap;featuremap'
  input_layout_train: 'NCHW;NHWC'
  norm_type: 'no_preprocess;no_preprocess'

calibration_parameters:
  cal_data_dir: '../cal_data/spindle/x;../cal_data/spindle/h'
  cal_data_type: 'float32;float32'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
